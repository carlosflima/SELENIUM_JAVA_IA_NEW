# Configurações de URL
url.web=https://hml.seusite.com.br
url.api=https://api-hml.seusite.com.br/v1

# Configurações de Banco de Dados (HML)
db.url=jdbc:mysql://db-hml.seusite.com:3306/qa_db
db.user=qa_automation
db.pass=senha_segura_hml

# Configurações Cloud (AWS/Azure)
